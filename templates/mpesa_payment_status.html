<!DOCTYPE html>
<html>
<head>
    <title>Payment Status – Service Plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .timer-text { font-size: 1.2rem; font-weight: 600; color: #1e40af; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full" id="app"></div>

    <script>
        const bookingId = {{ booking.id }};
        const dashboardUrl = "{{ url_for('dashboard') }}";
        const confirmUrl = `/api/confirm-payment/${bookingId}`;
        // Delay in milliseconds (7 seconds = 7000)
        const DELAY_MS = 7000;

        let countdownInterval = null;

        function showWaitingPage(secondsLeft) {
            document.getElementById('app').innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                    <div class="bg-gradient-to-r from-blue-500 to-indigo-600 px-6 py-5">
                        <span class="text-white font-bold text-xl">💳 Payment Processing</span>
                    </div>
                    <div class="p-6 text-center">
                        <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-12 h-12 text-blue-600 spinner" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800 mb-2">Processing Your Payment</h1>
                        <p class="text-gray-600 mb-3">Please do not close this window.</p>
                        <div class="bg-blue-50 rounded-xl p-3 mb-4">
                            <p class="text-sm text-blue-800">⏳ Verifying transaction... <span class="timer-text">${secondsLeft}</span> seconds remaining</p>
                        </div>
                        <a href="${dashboardUrl}" class="inline-flex items-center justify-center gap-2 w-full bg-black text-white py-3 rounded-xl font-semibold hover:bg-gray-800 transition">
                            <span>🏠</span> Back to Dashboard
                        </a>
                    </div>
                </div>
            `;
        }

        async function confirmPayment() {
            try {
                const resp = await fetch(confirmUrl, { method: 'POST' });
                const data = await resp.json();
                console.log('Confirm response:', data);
            } catch (err) {
                console.error('Confirm error:', err);
            }
        }

        function showSuccessPage() {
            document.getElementById('app').innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                    <div class="bg-gradient-to-r from-green-500 to-green-600 px-6 py-5">
                        <span class="text-white font-bold text-xl">✅ Payment Successful</span>
                    </div>
                    <div class="p-6 text-center">
                        <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800 mb-2">Payment Successful! 🎉</h1>
                        <p class="text-gray-600 mb-4">Your payment has been confirmed.</p>
                        <p class="text-sm text-green-600 mb-4">Redirecting to dashboard...</p>
                        <a href="${dashboardUrl}" class="inline-flex w-full bg-black text-white py-3 rounded-xl justify-center">Go to Dashboard Now</a>
                    </div>
                </div>
            `;
        }

        // Start the waiting page with a countdown
        let secondsRemaining = DELAY_MS / 1000;
        showWaitingPage(secondsRemaining);

        // Update countdown every second
        countdownInterval = setInterval(() => {
            secondsRemaining--;
            if (secondsRemaining > 0) {
                // Update only the timer text without re‑rendering the whole page
                const timerSpan = document.querySelector('.timer-text');
                if (timerSpan) timerSpan.innerText = secondsRemaining;
            } else {
                clearInterval(countdownInterval);
                // After delay, confirm payment and show success
                confirmPayment().then(() => {
                    showSuccessPage();
                    setTimeout(() => {
                        window.location.href = dashboardUrl;
                    }, 2000);
                });
            }
        }, 1000);
    </script>
</body>
</html>
