<!DOCTYPE html>
<html>
<head>
    <title>Secure Payment – Service Plus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="max-w-md mx-auto p-6">
        <div class="bg-white rounded-xl shadow-md p-6">
            <h1 class="text-2xl font-bold mb-4">🔒 Secure Payment</h1>
            <p class="text-gray-600 mb-4">Your payment will be held in escrow and only released after service completion.</p>
            <div class="border-t border-gray-200 pt-4 mb-4">
                <p><strong>Service:</strong> {{ booking.service.title }}</p>
                <p><strong>Amount:</strong> ${{ "%.2f"|format(booking.service.price) }}</p>
                <p><strong>Provider:</strong> {{ booking.provider.full_name }}</p>
            </div>
            <form method="POST" action="{{ url_for('authorize_payment', booking_id=booking.id) }}">
                <div class="mb-3">
                    <label class="block text-sm font-bold">Card Number (demo)</label>
                    <input type="text" name="card_number" placeholder="4242 4242 4242 4242" class="w-full border rounded p-2" required>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-sm font-bold">Expiry</label>
                        <input type="text" name="expiry" placeholder="MM/YY" class="border rounded p-2 w-full" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold">CVC</label>
                        <input type="text" name="cvc" placeholder="123" class="border rounded p-2 w-full" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-black text-white py-2 rounded-lg font-bold">Authorize Payment</button>
            </form>
            <p class="text-xs text-gray-400 mt-4">No real money is charged. This simulates payment escrow.</p>
        </div>
    </div>
</body>
</html>
